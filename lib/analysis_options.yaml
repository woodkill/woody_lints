# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`.
# This set helps identify many issues that may lead to problems when running
# or consuming Dart code, and enforces writing Dart using a single, idiomatic
# style and format.
#
# If you want a smaller set of lints you can change this to specify
# 'package:lints/core.yaml'. These are just the most critical lints
# (the recommended set includes the core lints).
# The core lints are also what is used by pub.dev for scoring packages.
include: package:flutter_lints/flutter.yaml

# formatter:
#   trailing_commas: preserve

# Uncomment the following section to specify additional rules.

linter:
  rules:
    # 성능
    - prefer_const_constructors # 위젯 재사용을 극대화하여 성능 향상
    - prefer_const_literals_to_create_immutables # 불변 컬렉션의 효율적 관리
    - sized_box_for_whitespace # 가벼운 여백 위젯 사용 권장
    
    # 가독성 및 스타일
    - always_declare_return_types # 함수의 명확한 의도 파악
    - sort_child_properties_last # 위젯 트리 구조 시각화 개선
    - prefer_final_locals # 데이터의 불변성 보장
    # - require_trailing_commas # 자동 코드 정렬 최적화
    - prefer_single_quotes # 홑따옴표('') 사용 통일
    - slash_for_doc_comments # 문서 주석 슬래시 사용 통일
    # - public_member_api_docs # 공개 API에 대한 문서화 권장
    
    # 버그 방지
    - use_build_context_synchronously # 비동기 작업 시 잘못된 Context 참조 방지 (매우 중요)
    - unawaited_futures # 처리되지 않은 Future 감지
    - avoid_print # 실 서비스 앱에서 불필요한 로그 노출 방지
    - control_flow_in_finally # finally 블록 내 제어문 사용 금지

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - '**/*.freezed.dart'
    - '**/*.g.dart'

# analyzer plugin (Dart 3.10+ analysis_server_plugin 방식) — 최상위 키.
# riverpod_lint 3.x 는 이 방식만 지원한다. 옛 `analyzer: plugins:` 선언은
# 아무것도 로드하지 않았고, Dart 3.13 부터 legacy plugin 경고를 낸다.
# plugin 은 프로젝트 pubspec.lock 과 별도로 Dart Analysis Server 의 plugin 캐시
# (~/.dartServer/.plugin_manager)에서 해석된다.
# 이 섹션을 바꾼 뒤에는 Dart Analysis Server 를 재시작해야 반영된다.
# 결과 확인은 `dart analyze` 로 한다 — Flutter 3.47.5 의 `flutter analyze` 는
# plugin 진단을 표시하지 않았다 (3.41.9 는 표시, 2026-09-20 실측).
plugins:
  riverpod_lint: ^3.1.3

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints

# For additional information about configuring this file, see
# https://dart.dev/guides/language/analysis-options
