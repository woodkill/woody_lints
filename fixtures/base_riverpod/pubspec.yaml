name: woody_lints_fixture_base_riverpod
description: woody_lints 검증용 연습 프로젝트 — base.yaml 과 riverpod.yaml 만 받아 Riverpod 조각만 따로 받아도 plugin 이 돌고 codegen 설정은 딸려 오지 않는지 본다.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter_riverpod: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  # 저장소 루트의 woody_lints 를 그대로 받는다 (사용 프로젝트의 git 의존성 자리).
  woody_lints:
    path: ../..
