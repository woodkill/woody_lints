name: woody_lints
description: Woody's custom lint rules for Flutter projects.
version: 2.0.0-dev

# pub.dev에 올리지 않고 개인적으로 사용
publish_to: 'none'

repository: https://github.com/woodkill/woody_lints.git

environment:
  sdk: ^3.13.0

# lib/analysis_options.yaml 이 `include: package:flutter_lints/flutter.yaml` 을
# 쓰므로 사용하는 프로젝트에 전달되는 dependencies 에 둔다
# (dev_dependencies 는 사용하는 쪽 의존성 그래프에 포함되지 않는다).
dependencies:
  flutter_lints: ^6.0.0

# tool/verify.dart 가 줄 단위로 읽은 값을 YAML 해석 결과와 견줄 때만 쓴다 — analyzer · pub 과 같은 해석기.
# dev_dependencies 는 이 패키지를 받는 쪽 의존성 그래프에 들어가지 않는다 (05-VERIFICATION.md 4회차 gap, 소유자 결정 G4-Q1).
dev_dependencies:
  yaml: ^3.1.4
