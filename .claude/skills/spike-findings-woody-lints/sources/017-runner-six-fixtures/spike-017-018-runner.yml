# spike 017 · 018 전용 — GitHub Linux runner 에서 연습용 프로젝트 여섯에 드는 시간과,
# 다음 runner 이미지(Ubuntu 26.04)에서 검증이 지금과 같은 결과를 내는지를 잰다
# (.planning/spikes/017-runner-six-fixtures/, .planning/spikes/018-runner-next-image/).
#
# Phase 2 의 실제 CI(verify.yml)가 아니다. spike 결과를 기록한 뒤 이 파일은 지운다.
name: spike-017-018-runner

on:
  push:
    branches:
      - 'gsd/v2.0-package-rework'

# 저장소를 읽기만 한다.
permissions:
  contents: read

# 같은 브랜치에 새로 올리면 앞선 실행은 취소한다.
concurrency:
  group: spike-017-018-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 나눈 구조의 복사본에서 연습용 프로젝트 여섯을 돌린다. job 하나가 새 가상 머신 하나다.
  six:
    name: six · ${{ matrix.os }} · ${{ matrix.mode }} · ${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 한 표본이 실패해도 나머지 표본의 결과를 끝까지 받는다.
      fail-fast: false
      matrix:
        # 24.04 는 지금의 ubuntu-latest, 26.04 는 2026-10-19 부터 옮겨 갈 이미지다 (actions/runner-images#14748).
        os: [ubuntu-24.04, ubuntu-26.04]
        # seq = 차례로, par = 한꺼번에. 처음 받는 경우를 보려고 방식마다 job 을 따로 둔다.
        mode: [seq, par]
        sample: [1, 2, 3]
    env:
      SPIKE_OS_LABEL: ${{ matrix.os }}
      SPIKE_MODE: ${{ matrix.mode }}
      SPIKE_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v7

      # .fvmrc 를 읽어 로컬과 같은 Flutter 를 설치한다. 처음 실행을 재려고 캐시는 켜지 않는다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - name: 컴퓨터와 SDK
        run: |
          head -4 /etc/os-release
          nproc
          free -m | head -2
          ldd --version | head -1
          flutter --version
          dart --version

      - name: 여섯 프로젝트 점검
        run: dart run .planning/spikes/017-runner-six-fixtures/runner_probe.dart "$RUNNER_TEMP/spike017" "$SPIKE_MODE"

  # 지금의 검증 명령을 verify.yml 과 같은 step 으로, 이미지만 26.04 로 바꿔 돌린다.
  verify26:
    name: verify · ubuntu-26.04 · ${{ matrix.sample }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc

      - name: 컴퓨터
        run: |
          head -4 /etc/os-release
          nproc
          ldd --version | head -1

      - name: 검증
        run: dart run tool/verify.dart
